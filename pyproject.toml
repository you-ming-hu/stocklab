[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stocklab"
version = "0.0.1"
description = ""
readme = "README.md"
dependencies = [
    "pandas>=3.0.2",
    "requests>=2.33.1",
]

[project.optional-dependencies]

[dependency-groups]
dev = [
    "pydantic>=2.13.4",
    "beautifulsoup4>=4.14.3",
]

[tool.uv.sources]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
package_name = ["*.yaml", "*.json"]
